<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuBtn = document.querySelector('#menu-open-btn'); // The menu icon button
    const closeBtn = document.getElementById('close-menu');
    const menuOverlay = document.getElementById('mobile-menu');
    const navLinks = document.querySelectorAll('#mobile-menu a');

    if (!menuBtn || !menuOverlay) return;

    function toggleMenu() {
        menuOverlay.classList.toggle('translate-x-full');
        document.body.classList.toggle('overflow-hidden');
    }

    menuBtn.addEventListener('click', toggleMenu);
    if (closeBtn) closeBtn.addEventListener('click', toggleMenu);
    
    navLinks.forEach(link => {
        link.addEventListener('click', toggleMenu);
    });

    // Close on click outside (though overlay is full screen, so not applicable here)
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const submitBtn = document.querySelector('button[type="submit"]');
    if (!submitBtn) return;
    submitBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
        if (!name || !email || !message) {
            alert('Oops! You missed a spot. Please fill in all fields so Shin can read your letter!');
            return;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert('That return address looks fishy! Please enter a real email.');
            return;
        }
        submitBtn.innerHTML = '<span>Sending...</span>';
        submitBtn.disabled = true;
        setTimeout(() => {
            alert('ACTION MESSAGE SENT! The Nohara house has received your letter. Wait for the mischief to begin!');
            submitBtn.innerHTML = '<span>Send the Action Message!</span><span class="material-symbols-outlined text-[32px] group-hover:translate-x-2 transition-transform" data-icon="send">send</span>';
            submitBtn.disabled = false;
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('message').value = '';
        }, 1500);
    });
});
</script>
